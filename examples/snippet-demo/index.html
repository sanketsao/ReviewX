<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ReviewX snippet demo</title>
    <style>
      :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      body { margin: 0; background: #f3f4f6; color: #111827; }
      .wrap { max-width: 760px; margin: 0 auto; padding: 48px 24px 96px; }
      h1 { font-size: 36px; margin: 0 0 8px; }
      .tagline { color: #6b7280; font-size: 18px; margin: 0 0 32px; }
      .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 24px; margin: 16px 0; }
      .btn { background: #6366f1; color: #fff; border: 0; border-radius: 10px; padding: 12px 20px; font-size: 16px; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1 id="title">SnippetCo</h1>
      <p class="tagline" id="tagline">A bare HTML page using the ReviewX CDN snippet — no server.</p>

      <div class="card" id="card-pricing">
        <h2>Pricing</h2>
        <p>Drop one line into any prototype and reviewers can comment instantly.</p>
        <button class="btn" id="cta">Start free</button>
      </div>

      <div class="card" id="card-how">
        <h2>How it works</h2>
        <p>Feedback persists in this browser via localStorage (the zero-backend default).</p>
      </div>
    </div>

    <!-- In production this points at a CDN, e.g.:
         <script src="https://cdn.jsdelivr.net/npm/reviewx@1" data-reviewx></script>
         Here we load the locally-built bundle and force author tools for testing. -->
    <script
      src="/packages/overlay/dist/reviewx.js"
      data-reviewx
      data-role="author"
      data-project="snippet-demo"
    ></script>
  </body>
</html>
